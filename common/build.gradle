plugins {
    id 'java-library'
}

// Tarea para compilar Slice a Java antes de compilar el codigo fuente
task compileSlice(type: Exec) {
    description = 'Compila los contratos .ice a codigo fuente Java usando slice2java'

    doFirst {
        file("src/main/java").mkdirs()
    }

    // Invoca la utilidad nativa slice2java de ZeroC sobre TODOS los .ice
    // (Chat.ice, Session.ice, ...). -I permite usar #include entre contratos.
    def sliceFiles = fileTree('src/main/slice') { include '**/*.ice' }
    inputs.files(sliceFiles)
    commandLine(['slice2java',
            '--output-dir', 'src/main/java',
            '-I', 'src/main/slice'] + sliceFiles.files.collect { it.path }.sort())
}

// Asegura que Java dependa de la generacion previa del codigo de Slice
compileJava.dependsOn compileSlice